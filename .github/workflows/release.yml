# Push a tag to release — no manual version bump or sync scripts required.
#   git tag v0.0.10 && git push origin v0.0.10
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3"

      - run: bun install --frozen-lockfile
      - run: bun run build:admin
      - run: bun test

  release:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build admin UI
        run: bun run build:admin

      - name: Build headless server (Windows executable)
        run: bun run --filter @bizshuffle-bun/server-app build:release

      - name: Build desktop app (Electrobun stable)
        working-directory: apps/desktop
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bun run build:release

      - name: Package server release zip
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bun run package:server

      - name: Collect release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-upload | Out-Null
          Get-ChildItem release-staging -Filter *.zip | Copy-Item -Destination release-upload/
          if (Test-Path apps/desktop/artifacts) {
            Copy-Item -Path apps/desktop/artifacts/* -Destination release-upload/ -Recurse -Force
          }
          if (-not (Get-ChildItem release-upload)) {
            Write-Error "No release assets produced"
            exit 1
          }
          Write-Host "Release assets:"
          Get-ChildItem release-upload -Recurse -File | Format-Table Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-upload/*

      - name: Sync desktop version on main
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          bun run scripts/sync-desktop-version.ts
          git add apps/desktop/package.json apps/desktop/electrobun.config.ts
          if git diff --staged --quiet; then
            echo "main already has desktop version ${{ github.ref_name }}"
          else
            git commit -m "chore(desktop): sync version to ${{ github.ref_name }}"
            git push origin main
          fi
